<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "en" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Site.Title }}</title>
  <meta name="description" content="{{ .Site.Params.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  {{ with resources.Get "css/main.css" }}
    {{ $css := . | minify | fingerprint }}
    <link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
  {{ end }}
</head>
<body>
  <header class="topbar">
    <nav class="nav-inner">
      <a class="brand" href="#home">{{ .Site.Params.name }}</a>
      <ul class="nav-links">
        {{ range .Site.Params.nav }}
          <li><a href="#{{ .id }}" data-nav="{{ .id }}">{{ .name }}</a></li>
        {{ end }}
      </ul>
    </nav>
  </header>

  <main>{{ block "main" . }}{{ end }}</main>

  <footer class="footer">
    <p>&copy; {{ now.Year }} {{ .Site.Params.name }}</p>
  </footer>

  <script>
  (function () {
    var links = document.querySelectorAll('[data-nav]');
    var sections = [].map.call(links, function (l) {
      return document.getElementById(l.dataset.nav);
    });
    function sync() {
      var pos = window.scrollY + 140, current = 0;
      sections.forEach(function (s, i) { if (s && s.offsetTop <= pos) current = i; });
      links.forEach(function (l, i) { l.classList.toggle('active', i === current); });
    }
    window.addEventListener('scroll', sync, { passive: true });
    sync();
  })();
  </script>
</body>
</html>
