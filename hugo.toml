baseURL = "https://niccolozaccaria.com/"
locale = "en-us"
title = "Niccolò Zaccaria"
enableRobotsTXT = true
# No blog, so no taxonomy pages: they only generated empty URLs.
disableKinds = ["taxonomy", "term"]

[params]
  name        = "Niccolò Zaccaria"
  role        = "PhD Candidate in Economics"
  affiliation = "Tilburg University"
  affiliationURL = "https://www.tilburguniversity.edu/"
  email       = "n.zaccaria@tilburguniversity.edu"
  photo       = "images/profile.jpg"
  # rothko | rothko-pale | rothko-cool | rothko-orange | rothko-maroon | rothko-royal
  # rothko-white-center | rothko-green-maroon | rothko-yellow-blue | rothko-no14
  # rothko-ochre-red | rothko-magenta | none
  art          = "rothko-yellow-blue"
  art_strength = 0.90   # 0-1: how far forward the artwork sits
  art_frame    = true   # content on paper, artwork as the surrounding mount
  grain_strength = 0.35   # 0-1: how much tooth the surround has
  nav_mode     = "static"   # fade | reveal | rail | paper | static
  cv          = "/files/cv.pdf"
  description = "Niccolò Zaccaria, PhD candidate in Economics at Tilburg University. Research on price rigidities, firm dynamics, and the economics of AI."

[[params.nav]]
  name = "Home"
  id   = "home"
[[params.nav]]
  name = "Research"
  id   = "research"
[[params.nav]]
  name = "Teaching"
  id   = "teaching"
[[params.nav]]
  name = "CV"
  id   = "cv"

[markup.goldmark.renderer]
  unsafe = true
